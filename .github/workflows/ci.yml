name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node for backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Set up Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Write SSL files
        run: |
          mkdir -p ~/SchedulerApp/ssl
          echo "${{ secrets.KEY }}" > ~/SchedulerApp/ssl/key.pem
          echo "${{ secrets.CERT }}" > ~/SchedulerApp/ssl/cert.pem

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # - name: Run backend unit tests
      #   working-directory: ./backend
      #   run: |
      #     echo "Running backend unit tests..."
      #     npm test

      - name: Start PostgreSQL for backend
        run: |
          docker network create ci-network || true
          docker run -d \
            --name ci-db\
            --network ci-network \
            -e POSTGRES_USER=${{ secrets.DB_USER }} \
            -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}\
            -e POSTGRES_DB=${{ secrets.DB_NAME }} \
            postgres:16
          for i in {1..10}; do
            docker exec ci-db pg_isready -U ${{ secrets.DB_USER }} && break
            echo "Waiting for DB..."
            sleep 2
          done

      - name: Run backend and wait for health
        working-directory: ./backend
        run: |
          docker build -t ci-scheduler-backend .
          docker run -d \
            --name ci-backend \
            --network ci-network \
            -p 8083:8083 \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD}} \
            -e DB_NAME=${{ secrets.DB_NAME}} \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_PORT=${{ secrets.DB_PORT }}\
            -e PORT=${{ secrets.PORT }} \
            ci-scheduler-backend
          for i in {1..30}; do
            if curl -sSf https://localhost:8083/api/health; then
              echo "backend healthy"
              break
            fi
            echo "waiting for backend..."
            sleep 2
          done
          if ! curl -sSf https://localhost:8083/api/health; then
            echo "ERROR: Backend did not become healthy after 30 attempts"
            docker logs ci-backend
            docker stop ci-backend || true
            docker rm ci-backend || true
            docker stop ci-db || true
            exit 1
          fi
          docker logs ci-backend
          docker stop ci-backend || true
          docker rm ci-backend || true
          docker stop ci-db || true
          docker rm ci-db || true

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: |
          echo "Running frontend unit tests..."
          npm test -- --watch=false --browsers=ChromeHeadless || npm run test:ci

      - name: Build frontend (production)
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Docker Compose build (sanity)
        run: docker compose build --no-cache
