name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node for backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Set up Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # - name: Run backend unit tests
      #   working-directory: ./backend
      #   run: |
      #     echo "Running backend unit tests..."
      #     npm test

      - name: Start PostgreSQL for backend # hasla i login do zmiany kiedy zostana dodane do secretow
        run: |
          docker run -d --name ci-db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=scheduler \
            -p 5432:5432 postgres:16
          for i in {1..10}; do
            docker exec ci-db pg_isready -U postgres && break
            echo "Waiting for DB..."
            sleep 2
          done

      - name: Run backend and wait for health # hasla i login do zmiany kiedy zostana dodane do secretow
        working-directory: ./backend
        run: |
          docker build -t ci-scheduler-backend .
          docker run -d --name ci-backend -p 8083:8083 \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_NAME=scheduler \
            -e DB_HOST=db \
            --link ci-db:db \
            ci-scheduler-backend
          for i in {1..30}; do
            if curl -sSf http://localhost:8083/health; then
              echo "backend healthy"
              break
            fi
            echo "waiting for backend..."
            sleep 2
          done
          docker logs ci-backend
          docker stop ci-backend || true
          docker rm ci-backend || true
          docker stop ci-db || true
          docker rm ci-db || true

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: |
          echo "Running frontend unit tests..."
          npm test -- --watch=false --browsers=ChromeHeadless || npm run test:ci

      - name: Build frontend (production)
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Docker Compose build (sanity)
        run: docker compose build --no-cache
