name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node for backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Set up Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # - name: Run backend unit tests
      #   working-directory: ./backend
      #   run: |
      #     echo "Running backend unit tests..."
      #     npm test

      - name: Run backend basic smoke test (start + health check)
        working-directory: ./backend
        run: |
          docker build -t ci-scheduler-backend .
          docker run -d --name ci-backend -p 8083:8083 ci-scheduler-backend
          for i in {1..15}; do
            if curl -sSf http://localhost:8083/health; then
              echo "backend healthy"
              break
            fi
            echo "waiting for backend..."
            sleep 2
          done
          docker stop ci-backend || true
          docker rm ci-backend || true

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: |
          echo "Running frontend unit tests..."
          npm test -- --watch=false --browsers=ChromeHeadless || npm run test:ci

      - name: Build frontend (production)
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Docker Compose build (sanity)
        run: docker compose build --no-cache
