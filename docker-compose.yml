services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheduler-backend
    ports:
      - "8083:8083"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - scheduler-net

  db:
    image: postgres:16
    container_name: scheduler-db
    restart: always
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - scheduler-net

  frontend:
    build: ./frontend
    container_name: scheduler-frontend
    ports:
      - "4200:80"
    networks:
      - scheduler-net
    depends_on:
      - backend

networks:
  scheduler-net:
    driver: bridge

volumes:
  pgdata:
