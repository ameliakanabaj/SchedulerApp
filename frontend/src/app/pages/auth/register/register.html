<div class="register-container">
    <div class="register-inside-container">
        <h2>Register</h2>
        <form>
            <div class="form-group">
                <label for="username"> Email: </label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required />
            </div>
            <div class="form-group">
                <label for="username"> First name: </label>
                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    [(ngModel)]="firstName"
                    required
                />
            </div>
            <div class="form-group">
                <label for="username"> Last name: </label>
                <input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" required />
            </div>
            <div class="form-group password-group">
                <label for="username"> Password: </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    required
                />
                <i title="Password needs to be at least 8 characters long, contain at least one uppercase letter and one number" class="fa-solid fa-circle-info"></i>
            </div>
            <div class="form-group">
                <label for="password"> Enter password again: </label>
                <input
                    type="password"
                    id="password"
                    name="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    required
                />
            </div>
            <li class="divider"></li>
            <div class="bottom-group">
                <span> already have an account? <a routerLink="/login"> Login </a></span>
                <button type="submit" (click)="onRegister()">Register</button>
            </div>
        </form>
    </div>
</div>
