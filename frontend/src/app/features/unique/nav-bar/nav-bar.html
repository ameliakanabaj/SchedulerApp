<div class="nav-bar-container">
    <a routerLink="{{ userAuthenticated() ? 'dashboard' : 'landing'}}"><button class="logo"><i class="fa-regular fa-calendar"></i></button></a>
    @if (userAuthenticated()) {
        <div class="nav-bar-buttons">
            <a routerLink="/dashboard"><button [ngClass]="{ 'active-button': route() === 'dashboard' }">
                Dashboard
            </button></a>
            <a routerLink="/availability"><button [ngClass]="{ 'active-button': route() === 'schedules' }">
                Availability
            </button></a>
            <a routerLink="/organizations"><button [ngClass]="{ 'active-button': route() === 'organizations' }">
                Organization
            </button></a>
        </div>
        <button class="logout-button" (click)="logout()">Logout</button>
    } @else {
        <div>
            <a routerLink="/login"><button class="sign-in-button">Sign in!</button></a>
            <a routerLink="/register"><button class="sign-up-button">Sign up!</button></a>
        </div>
    }
</div>
