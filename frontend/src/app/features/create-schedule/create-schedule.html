<app-modal-header [title]="mode === 'create' ? 'Create New Schedule' : 'Edit Schedule'"/>

<div class="create-schedule-container">
    <form class="schedule-form" (ngSubmit)="createOrUpdateSchedule()">
        <label for="dateFrom"> Date From: </label>
        <input type="date" id="dateFrom" name="dateFrom" [(ngModel)]="dateFrom" required />

        <label for="dateTo"> Date To: </label>
        <input type="date" id="dateTo" name="dateTo" [(ngModel)]="dateTo" required />

        <label for="deadline"> Deadline Date: </label>
        <input type="date" id="deadline" name="deadline" [(ngModel)]="deadline" required />

        @if (isDisabled()) {
            <p class="error-message"> Please ensure all fields are filled correctly. Deadline must be on or before Date To. </p>
        }

        <div class="form-actions">
            <button type="button" (click)="close(false)"> Cancel </button>
            <button type="submit" [disabled]="isDisabled()">
                {{ mode === 'create' ? 'Create Schedule' : 'Update Schedule' }}
            </button>
        </div>
    </form>
</div>
