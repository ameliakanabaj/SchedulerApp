<div class="modal-content">
    <div class="modal-header">
        <h3>Remove user</h3>
    </div>

    <div class="modal-body">
        <p>Are you sure you want to remove {{ data?.fullName }}?</p>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="ref.close(false)">Cancel</button>
        <button type="button" class="btn-confirm" (click)="ref.close(true)">Remove</button>
    </div>
</div>
